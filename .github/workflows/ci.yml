name: Braj Darshan CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend API Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      - name: Verify Backend Server Code
        run: |
          cd backend
          node -e "console.log('Backend syntax check passed')"

  admin-build:
    name: Admin Panel Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install Admin Dependencies
        run: |
          cd admin
          npm ci
      - name: Build Admin Panel (Vite)
        run: |
          cd admin
          npm run build

  flutter-build:
    name: Flutter App Analysis & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get
      - name: Flutter Analyze
        run: |
          cd app
          flutter analyze
      - name: Build Android Release APK
        run: |
          cd app
          flutter build apk --release

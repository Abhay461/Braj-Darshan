name: Braj Darshan Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit-and-test:
    name: Backend API Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend Syntax
        run: |
          cd backend
          node --check src/server.js
          node --check src/app.js

  admin-build:
    name: Admin Panel Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        run: |
          cd admin
          npm ci

      - name: Build Vercel Admin Bundle
        env:
          VITE_API_BASE_URL: https://braj-darshan-api.onrender.com/api/v1
        run: |
          cd admin
          npm run build

  flutter-apk-build:
    name: Flutter Android Release APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: braj-darshan-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

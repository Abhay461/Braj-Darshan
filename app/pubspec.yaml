name: braj_darshan
description: "Braj Darshan — Temple Discovery Platform Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Network & Cache
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Local Offline Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Media & UI Animations
  photo_view: ^0.15.0
  flutter_animate: ^4.5.2
  table_calendar: ^3.1.2

  # Device & System Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0

  # Google Ads
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
